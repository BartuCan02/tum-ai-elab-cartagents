[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carthagents"
version = "0.1.0"
description = "Evidence-first German fixed asset schedule extraction"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24", "artifact-tool>=0.1"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
carthagents = "carthagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
